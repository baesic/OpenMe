[workspace]
resolver = "2"
members = [
  "crates/core-types",
  "crates/common-utils",
  "crates/doc-ingest",
  "crates/ai-pipeline",
  "crates/image-brief",
  "crates/sitegen",
  "crates/web-ui",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Whoborn Inc. baesic"]

[workspace.dependencies]
anyhow = "1.0"
core-types = { path = "crates/core-types" }
common-utils = { path = "crates/common-utils" }
image = { version = "0.25", default-features = false, features = ["webp"] }
pulldown-cmark = "0.12"
quick-xml = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.10"
toml = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
