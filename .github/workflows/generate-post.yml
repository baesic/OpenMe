name: Generate post

on:
  workflow_dispatch:
  push:
    paths:
      - "concepts/**"
      - "config/**"
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/generate-post.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Rust WASI target
        run: rustup target add wasm32-wasip1

      - name: Install Wasmtime
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build WASM generators
        run: cargo build --release --target wasm32-wasip1 -p ai-pipeline -p image-brief

      - name: Run AI pipeline WASM
        env:
          OPENME_AI_RESPONSE_DIR: ${{ vars.OPENME_AI_RESPONSE_DIR }}
        run: |
          wasmtime --dir . target/wasm32-wasip1/release/ai-pipeline.wasm -- \
            --concepts concepts \
            --output content/posts \
            --providers config/ai-providers.toml \
            --rubric config/evaluation-rubric.toml \
            --site-config config/site.toml

      - name: Generate image briefs and repository images
        env:
          OPENME_IMAGE_RESPONSE_DIR: ${{ vars.OPENME_IMAGE_RESPONSE_DIR }}
        run: |
          wasmtime --dir . target/wasm32-wasip1/release/image-brief.wasm -- \
            --posts content/posts \
            --images static/images/posts

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts content/drafts static/images/posts
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Generate OpenMe post content"
            git push
          fi
